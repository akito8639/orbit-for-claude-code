name: Release

# Tag `v1.2.3` → build, sign with Developer ID, notarize, zip, attach to the GitHub release.
# Required repository secrets:
#   DEVELOPER_ID_P12          base64 of the "Developer ID Application" certificate (.p12)
#   DEVELOPER_ID_P12_PASSWORD password of that .p12
#   DEVELOPMENT_TEAM          Apple Team ID (e.g. ABCDE12345)
#   NOTARY_APPLE_ID           Apple ID used for notarization
#   NOTARY_PASSWORD           app-specific password for that Apple ID
#   SPARKLE_PRIVATE_KEY       EdDSA private key exported with `generate_keys -x` (signs the appcast entry)
on:
  push:
    tags: ["v*"]

jobs:
  release:
    runs-on: macos-26
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app && xcodebuild -version

      - name: Import signing certificate
        env:
          P12: ${{ secrets.DEVELOPER_ID_P12 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        run: |
          echo "$P12" | base64 --decode > cert.p12
          security create-keychain -p ci build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p ci build.keychain
          security import cert.p12 -k build.keychain -P "$P12_PASSWORD" -T /usr/bin/codesign
          # Apple's intermediate for Developer ID — without it the signature chain does not validate.
          curl -sSL -o DeveloperIDG2CA.cer https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer
          security import DeveloperIDG2CA.cer -k build.keychain -T /usr/bin/codesign || true
          security set-key-partition-list -S apple-tool:,apple: -s -k ci build.keychain
          security find-identity -v -p codesigning build.keychain

      - name: Build and sign
        env:
          TEAM: ${{ secrets.DEVELOPMENT_TEAM }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          xcodebuild -project Orbit.xcodeproj -scheme Orbit -configuration Release \
            -derivedDataPath build \
            DEVELOPMENT_TEAM="$TEAM" \
            CODE_SIGN_IDENTITY="Developer ID Application" \
            CODE_SIGN_INJECT_BASE_ENTITLEMENTS=NO \
            MARKETING_VERSION="$VERSION" CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            OTHER_CODE_SIGN_FLAGS="--timestamp" build
          codesign -d --entitlements :- "build/Build/Products/Release/Orbit for Claude Code.app" | grep -c get-task-allow && { echo "get-task-allow still present"; exit 1; } || true

      - name: Re-sign Sparkle and the bundle (Developer ID, hardened runtime, secure timestamp)
        run: |
          APP="build/Build/Products/Release/Orbit for Claude Code.app"
          ID="Developer ID Application"
          FW="$APP/Contents/Frameworks/Sparkle.framework"
          # Sparkle ships its helpers signed by the Sparkle project; notarization wants our identity on everything.
          for b in "$FW/Versions/B/XPCServices/Installer.xpc" "$FW/Versions/B/XPCServices/Downloader.xpc" \
                   "$FW/Versions/B/Autoupdate" "$FW/Versions/B/Updater.app"; do
            [ -e "$b" ] && codesign -f -o runtime --timestamp --preserve-metadata=entitlements -s "$ID" "$b"
          done
          codesign -f -o runtime --timestamp -s "$ID" "$FW"
          codesign -f -o runtime --timestamp --preserve-metadata=entitlements -s "$ID" "$APP/Contents/PlugIns/OrbitWidget.appex"
          codesign -f -o runtime --timestamp --preserve-metadata=entitlements -s "$ID" "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"

      - name: Notarize and staple
        env:
          APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          APP_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
          TEAM: ${{ secrets.DEVELOPMENT_TEAM }}
        run: |
          APP="build/Build/Products/Release/Orbit for Claude Code.app"
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign -dvv "$APP" 2>&1 | grep -E 'Authority|TeamIdentifier|Timestamp|flags'
          ditto -c -k --keepParent "$APP" Orbit.zip
          OUT=$(xcrun notarytool submit Orbit.zip --apple-id "$APPLE_ID" --password "$APP_PASSWORD" --team-id "$TEAM" --wait 2>&1 | tee /dev/stderr)
          ID=$(echo "$OUT" | grep -m1 -oE 'id: [0-9a-f-]+' | cut -d' ' -f2)
          if ! echo "$OUT" | grep -q 'status: Accepted'; then
            echo "::group::notarization log"
            xcrun notarytool log "$ID" --apple-id "$APPLE_ID" --password "$APP_PASSWORD" --team-id "$TEAM" || true
            echo "::endgroup::"
            exit 1
          fi
          xcrun stapler staple "$APP"
          rm Orbit.zip
          ditto -c -k --keepParent "$APP" "Orbit-for-Claude-Code-${GITHUB_REF_NAME#v}.zip"
          shasum -a 256 "Orbit-for-Claude-Code-${GITHUB_REF_NAME#v}.zip" | tee sha256.txt

      - name: Sparkle appcast
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ZIP="Orbit-for-Claude-Code-${VERSION}.zip"
          SIGN=$(find ~/Library/Developer/Xcode/DerivedData build -path '*artifacts/sparkle/Sparkle/bin/sign_update' 2>/dev/null | head -1)
          [ -n "$SIGN" ] || SIGN=$(find / -path '*/Sparkle/bin/sign_update' 2>/dev/null | head -1)
          printf '%s' "$SPARKLE_PRIVATE_KEY" | tr -d '\n\r ' > sparkle.key
          SIG=$("$SIGN" --ed-key-file sparkle.key "$ZIP") || { echo "sign_update failed"; rm -f sparkle.key; exit 1; }
          rm -f sparkle.key
          echo "signature: $SIG"                                   # sparkle:edSignature="…" length="…"
          BUILD="${{ github.run_number }}"
          cat > appcast.xml <<EOF
          <?xml version="1.0" encoding="utf-8"?>
          <rss version="2.0" xmlns:sparkle="http://www.andymatuschak.org/xml-namespaces/sparkle">
            <channel>
              <title>Orbit for Claude Code</title>
              <item>
                <title>${VERSION}</title>
                <pubDate>$(date -R)</pubDate>
                <sparkle:version>${BUILD}</sparkle:version>
                <sparkle:shortVersionString>${VERSION}</sparkle:shortVersionString>
                <sparkle:minimumSystemVersion>26.0</sparkle:minimumSystemVersion>
                <link>https://github.com/${{ github.repository }}/releases/tag/${GITHUB_REF_NAME}</link>
                <enclosure url="https://github.com/${{ github.repository }}/releases/download/${GITHUB_REF_NAME}/${ZIP}" ${SIG} type="application/octet-stream"/>
              </item>
            </channel>
          </rss>
          EOF
          sed -i '' 's/^          //' appcast.xml
          cat appcast.xml

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Orbit-for-Claude-Code-*.zip
            sha256.txt
            appcast.xml
          generate_release_notes: true
